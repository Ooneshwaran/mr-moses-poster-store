<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <!-- Frame Icon -->
  <g transform="translate(10, 10)">
    <!-- Outer Frame -->
    <rect x="0" y="0" width="60" height="60" rx="8" fill="url(#logoGrad)" />
    <!-- Inner Matting -->
    <rect x="8" y="8" width="44" height="44" rx="4" fill="#ffffff" />
    <!-- Art content / Photo corner -->
    <rect x="14" y="14" width="32" height="32" rx="2" fill="#f1f5f9" />
    <!-- Accent corner frame line -->
    <path d="M14 26 L14 14 L26 14" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" />
    <circle cx="34" cy="22" r="3.5" fill="url(#accentGrad)" />
    <!-- Mountain/Landscape line -->
    <path d="M16 42 L24 33 L30 38 L38 29 L44 42 Z" fill="#94a3b8" opacity="0.6" />
  </g>
  <!-- Text Brand -->
  <text x="82" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0f2b48" letter-spacing="-0.5">
    MR MOSES
  </text>
  <text x="220" y="38" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#f97316" letter-spacing="-0.5">
    POSTER
  </text>
  <text x="83" y="58" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="1.5">
    YOUR MOMENTS, OUR FRAMES
  </text>
</svg>
