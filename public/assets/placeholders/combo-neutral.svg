<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="12" fill="url(#cBg)" />

  <!-- Multiple poster arrangement -->
  <g transform="translate(60, 25)">
    <!-- Back / Larger Poster (A3) -->
    <rect x="0" y="0" width="100" height="150" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="6" y="6" width="88" height="138" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="2,2" />
    <circle cx="50" cy="50" r="14" fill="#fed7aa" />
    <path d="M15 110 L40 75 L60 95 L85 65 L85 110 Z" fill="#94a3b8" opacity="0.6" />

    <!-- Plus badge -->
    <circle cx="112" cy="75" r="12" fill="#f97316" />
    <path d="M112 68 L112 82 M105 75 L119 75" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Front / Smaller Poster (A5 or A4) -->
    <g transform="translate(115, 30)">
      <rect x="0" y="0" width="80" height="120" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" />
      <rect x="5" y="5" width="70" height="110" fill="#f1f5f9" />
      <circle cx="40" cy="40" r="10" fill="#bfdbfe" />
      <path d="M10 90 L30 65 L50 80 L70 55 L70 90 Z" fill="#64748b" opacity="0.6" />
    </g>
  </g>

  <!-- Tag -->
  <rect x="20" y="176" width="105" height="26" rx="6" fill="#0f2b48" />
  <text x="72" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    COMBO OFFER
  </text>

  <!-- Save Tag -->
  <g transform="translate(230, 20)">
    <rect x="0" y="0" width="70" height="24" rx="12" fill="#fef2f2" stroke="#fca5a5" stroke-width="1" />
    <text x="35" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">
      SAVE MORE
    </text>
  </g>
</svg>
