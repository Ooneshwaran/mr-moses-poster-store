<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2f6" />
    </linearGradient>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="320" height="220" rx="12" fill="url(#fBg)" />

  <!-- Wall Hanging String -->
  <path d="M125 15 L160 30 L195 15" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <circle cx="160" cy="30" r="3" fill="#64748b" />

  <!-- The Frame Outer -->
  <g transform="translate(90, 28)">
    <!-- Shadow -->
    <rect x="6" y="8" width="140" height="165" rx="4" fill="#0f2b48" opacity="0.12" />
    <!-- Solid Frame Border -->
    <rect x="0" y="0" width="140" height="165" rx="4" fill="url(#frameGrad)" stroke="#334155" stroke-width="2" />
    <!-- Matting (White Paspartu) -->
    <rect x="14" y="14" width="112" height="137" fill="#ffffff" />
    <!-- Artwork window -->
    <rect x="24" y="24" width="92" height="117" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />

    <!-- Neutral abstract art inside frame -->
    <circle cx="70" cy="62" r="15" fill="#fed7aa" opacity="0.8" />
    <path d="M30 115 L55 85 L75 105 L95 75 L110 115 Z" fill="#94a3b8" opacity="0.5" />
    <line x1="30" y1="120" x2="110" y2="120" stroke="#f97316" stroke-width="2" />
  </g>

  <!-- Dimension Indicator Tag -->
  <rect x="20" y="176" width="100" height="26" rx="6" fill="#0f2b48" />
  <text x="70" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    PHOTO FRAME
  </text>

  <!-- Glass Finish Badge -->
  <g transform="translate(235, 25)">
    <rect x="0" y="0" width="65" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="32" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#2563eb" text-anchor="middle">
      PROTECTIVE
    </text>
  </g>
</svg>
