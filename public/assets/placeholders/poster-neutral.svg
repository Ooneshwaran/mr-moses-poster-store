<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="0.8" />
    </pattern>
  </defs>
  <!-- Background card -->
  <rect width="320" height="220" rx="12" fill="url(#pBg)" />
  <rect width="320" height="220" fill="url(#grid)" opacity="0.6" />

  <!-- Poster Canvas -->
  <g transform="translate(100, 20)">
    <!-- Shadow -->
    <rect x="4" y="6" width="120" height="175" rx="4" fill="#0f2b48" opacity="0.08" />
    <!-- Poster paper -->
    <rect x="0" y="0" width="120" height="175" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Poster inner safe border -->
    <rect x="8" y="8" width="104" height="159" rx="2" fill="#fafafa" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Neutral poster line art -->
    <circle cx="60" cy="55" r="18" fill="#e2e8f0" />
    <path d="M22 135 L48 95 L72 120 L98 80 L102 135 Z" fill="#cbd5e1" opacity="0.8" />
    
    <!-- Poster corner badge -->
    <path d="M8 22 L8 8 L22 8" fill="none" stroke="#f97316" stroke-width="2" />
    <path d="M112 153 L112 167 L98 167" fill="none" stroke="#f97316" stroke-width="2" />
  </g>

  <!-- Dimension Indicator Tag -->
  <rect x="20" y="176" width="90" height="26" rx="6" fill="#0f2b48" />
  <text x="65" y="193" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    POSTER PRINT
  </text>

  <!-- Quality Stamp -->
  <g transform="translate(240, 25)">
    <circle cx="20" cy="20" r="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
    <text x="20" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#ea580c" text-anchor="middle">
      HQ
    </text>
  </g>
</svg>
